<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- O átomo com a CÂMERA no núcleo — a mesma marca de
       src/components/marca-tile.tsx. Mudou lá, mude aqui.

       A câmera entrou no favicon em 27/08/2026 a pedido do dono ("o fav icon
       também"). O traço dela é mais grosso que o do componente de propósito:
       a aba desenha isto a 16px, e traço fino some. Continua a versão ENXUTA
       (duas órbitas), pelo mesmo motivo de sempre.

       Hex em vez de variável: o favicon é carregado fora do documento e não
       enxerga o CSS da página. Fundo escuro fixo pelo mesmo motivo — a aba pode
       ser clara ou escura, e a marca precisa ler nas duas. -->
  <rect width="64" height="64" rx="14" fill="#07080b"/>

  <!-- as órbitas -->
  <g stroke="#cfd9ea" stroke-width="2.4" fill="none">
    <ellipse cx="32" cy="32" rx="20.5" ry="8" transform="rotate(30 32 32)"/>
    <ellipse cx="32" cy="32" rx="20.5" ry="8" transform="rotate(150 32 32)"/>
  </g>

  <!-- o núcleo: tapa as órbitas que passam atrás, senão o centro embola -->
  <circle cx="32" cy="32" r="10.5" fill="#07080b" stroke="#cfd9ea" stroke-width="2.8"/>

  <!-- a câmera, e o único âmbar na lente: a luz mora no vidro -->
  <g stroke="#cfd9ea" fill="none" stroke-linejoin="round">
    <rect x="26" y="28.8" width="12" height="7.8" rx="1.6" stroke-width="1.9"/>
    <path d="M 29.8 28.8 L 30.8 27 L 33.2 27 L 34.2 28.8" stroke-width="1.7"/>
    <circle cx="32" cy="32.7" r="2.6" stroke-width="1.6"/>
  </g>
  <circle cx="32" cy="32.7" r="1.3" fill="#d9a441"/>
</svg>
