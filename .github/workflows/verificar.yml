# Roda a suíte a cada push e pull request.
#
# Este repositório passou a existência inteira sem CI: as 62 suítes só rodavam
# na máquina de quem estava desenvolvendo, e só quando essa pessoa lembrava.
# O `testar-tudo.mjs` avisa em letras garrafais que "teste que ninguém roda é
# um teste que não existe" — e era exatamente o que estava acontecendo com ele
# mesmo.
#
# ── POR QUE UM BANCO E UM ARMAZÉM DE VERDADE, E NÃO DUBLÊS ────────────────
#
# Porque é isso que as suítes testam. Elas publicam galeria, apagam mídia,
# assinam URL de upload e conferem que o objeto saiu do bucket. Um dublê de
# armazenamento provaria que o dublê funciona.
#
# O Postgres vem como serviço; o armazém é um servidor S3 sobre arquivo, do npm
# (`scripts/armazem-de-teste.mjs`), que o app alcança por `R2_ENDPOINT` — a
# variável existe para isso e para o dia da troca de fornecedor, que
# `src/lib/r2.ts` já anunciava. Era um MinIO até 29/09/2026, quando o MinIO
# fechou o acesso público em todos os registradores; o passo que sobe o armazém
# conta a história inteira.
#
# Sem armazém, o `healthz` reprova e o corredor pula as 32 suítes de HTTP —
# inclusive as treze que passam por rota de arquivo. Metade da suíte viraria
# enfeite. Foi medido antes de este arquivo existir.

name: Verificar

on:
  # Sem `push: master` desde 10/10/2026. Todo merge no master dispara o `Publicar`,
  # cujo `deploy.sh` roda o MESMO portão (suíte com --exigir-tudo) no mesmo commit, e
  # o PR já passou por aqui antes do merge. Rodar a suíte inteira uma terceira vez
  # gastava ~364 min em 10 dias, com a cota de Actions (2.000 min/mês) a 90%.
  pull_request:
  workflow_dispatch:

# UMA RODADA POR BRANCH, e a nova cancela a anterior. Só vale porque esta workflow
# não PUBLICA nada: ela só confere. O `Publicar` não ganha esta linha — cancelar
# uma publicação no meio deixaria o servidor pela metade.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

# Só precisa ler o código: esta workflow roda em `pull_request`, ou seja, faz
# `npm ci` e build de código vindo de fora com o token do repositório ao alcance.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # O nome TERMINA em `_teste` de propósito: `scripts/guarda-producao.mjs`
          # recusa rodar suíte destrutiva contra banco que não pareça de teste, e
          # essa guarda tem de valer aqui como vale na máquina de qualquer um.
          POSTGRES_DB: fotonio_teste
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fotonio_teste
      # Segredos de MENTIRA, e é o certo: nenhuma suíte precisa de segredo real,
      # e um segredo de verdade aqui seria um segredo a mais para vazar. Longos o
      # bastante para as guardas de tamanho do próprio código aceitarem.
      SESSION_SECRET: segredo-de-sessao-so-do-ci-0123456789abcdef
      AVISOS_ENC_KEY: segredo-de-cifra-do-canal-de-avisos-so-do-ci-2026
      # A suíte de cobrança confere que a rota do webhook RECUSA quem não traz o
      # token. Para isso ela precisa que exista um token — qualquer um, desde
      # que os dois lados usem o mesmo. Nada aqui fala com o Asaas.
      ASAAS_WEBHOOK_TOKEN: token-de-webhook-so-do-ci-0123456789abcdef
      R2_ENDPOINT: http://127.0.0.1:9000
      # As chaves do `s3rver`. São de mentira como as de cima, e o armazém é
      # local: não há o que proteger, e o valor precisa casar com o que ele
      # espera. Ver `scripts/armazem-de-teste.mjs`.
      R2_ACCESS_KEY_ID: S3RVER
      R2_SECRET_ACCESS_KEY: S3RVER
      R2_BUCKET: galerias
      # O bucket vai no CAMINHO, não no subdomínio.
      #
      # Entrou no merge com o master de 22/09/2026: lá o `forcePathStyle` deixou
      # de ligar sozinho junto com o endereço e passou a ter chave própria, para
      # um fornecedor futuro poder usar endereço próprio e continuar no estilo
      # virtual. A troca é boa e cobra esta linha: R2 e B2 atendem em
      # `bucket.host`, e armazém local não tem DNS curinga para isso — sem ela o
      # cliente S3 procura `galerias.127.0.0.1`, não acha ninguém, e TODA rota de
      # arquivo cai com erro de DNS, que não diz nada sobre bucket nenhum.
      #
      # Em produção a variável não existe e nada muda.
      ARMAZEM_CAMINHO_NO_ENDERECO: "1"

    steps:
      # Actions presas ao sha do commit, não à tag: tag é PONTEIRO, e quem
      # controla o repositório da action reaponta `v4` para outro commit sem que
      # uma linha daqui mude. Mesma regra do repositório vizinho.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts`: o postinstall de qualquer pacote da árvore rodaria no
      # runner, que tem o token do repositório à mão. Nada aqui precisa deles.
      - name: Instalar dependências
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      # O portão de vulnerabilidade fica AQUI, antes de existir o que publicar.
      # `high`: `moderate` e `low` em árvore de dev pipocam sem parar e treinam a
      # gente a ignorar o vermelho — portão que vira ruído morre.
      #
      # Desde 03/10/2026 é um script, e não `npm audit --audit-level=high` direto:
      # a mesma régua, com uma saída estreita para alerta de ferramenta de
      # desenvolvimento SEM versão corrigida (o `braces` do ESLint), listado em
      # `.github/excecoes-do-audit.json` com motivo e data de revisão. O que vai
      # para produção nunca tem exceção. Ver `scripts/auditar-dependencias.mjs`.
      - name: Vulnerabilidade nas dependências
        run: node scripts/auditar-dependencias.mjs

      # ── O ARMAZÉM NÃO VEM MAIS DE FORA ────────────────────────────────────
      #
      # Era um MinIO, e em um mês o fornecedor fechou as TRÊS portas que havia:
      #
      #   · Docker Hub (`minio/minio`) — `pull access denied ... may require
      #     'docker login'`;
      #   · `quay.io/minio/minio` — `unauthorized: access to the requested
      #     resource is not authorized`, em qualquer tag, pinada ou móvel;
      #   · o binário de `dl.min.io` — **410 Gone**.
      #
      # Não foi tag que sumiu: foi o acesso público que acabou. Duas rodadas
      # foram gastas descobrindo isso, e a segunda só descobriu porque o passo
      # passou a imprimir o erro de cada tentativa em vez de engoli-lo.
      #
      # Agora o armazém vem do npm, que o CI já usa para existir (`npm ci`):
      # zero ponto de falha novo, porque sem npm não há CI de qualquer jeito.
      # Ver o cabeçalho de `scripts/armazem-de-teste.mjs`.
      #
      # E NÃO É UM DUBLÊ, que seria trocar a cobertura pela conveniência: o
      # `s3rver` implementa o protocolo S3 sobre o sistema de arquivos, e o app
      # fala com ele pelo `R2_ENDPOINT` com o mesmo `@aws-sdk/client-s3` de
      # produção — sem uma linha de desvio no código. Mudou QUEM atende, não O
      # QUE é exercitado: as suítes continuam assinando URL de upload, subindo
      # arquivo pela rede, lendo de volta e apagando 1200 chaves em lote.
      #
      # Medido nesta forma, com banco e servidor no ar: 129 passaram, 0
      # falharam, 2 não se aplicam (as de CORS, que dependem da política do
      # bucket no painel do fornecedor e o deploy.sh confere no VPS).
      - name: Subir o armazém (S3 sobre arquivo, do npm)
        run: |
          set -euo pipefail
          node scripts/armazem-de-teste.mjs --porta 9000 --bucket "$R2_BUCKET" \
            > /tmp/armazem.log 2>&1 &

          pronto=""
          for i in $(seq 1 30); do
            # Prova com uma IDA E VOLTA de verdade — grava, lê, apaga —, e com o
            # mesmo cliente S3 do app. "A porta aceita conexão" não prova que o
            # armazém responde S3, e sonda que mede a coisa errada é como um CI
            # passa a cobrir menos sem ninguém notar.
            if node scripts/armazem-de-teste.mjs --conferir; then
              pronto="sim"; break
            fi
            sleep 2
          done
          if [ -z "$pronto" ]; then
            echo "::error::o armazém não respondeu S3 em 60s"
            cat /tmp/armazem.log || true
            exit 1
          fi
          echo "armazém pronto: $R2_ENDPOINT (bucket $R2_BUCKET)"

      # As suítes recebem o ambiente por `--env-file=.env.local` (é o que o
      # `testar-tudo.mjs` passa a cada filho), então o arquivo precisa existir.
      - name: Montar o .env.local do CI
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "AVISOS_ENC_KEY=$AVISOS_ENC_KEY"
            echo "ASAAS_WEBHOOK_TOKEN=$ASAAS_WEBHOOK_TOKEN"
            echo "R2_ENDPOINT=$R2_ENDPOINT"
            echo "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "R2_BUCKET=$R2_BUCKET"
            echo "ARMAZEM_CAMINHO_NO_ENDERECO=$ARMAZEM_CAMINHO_NO_ENDERECO"
          } > .env.local

      # A receita do banco NOVO, e ela é de duas partes: `db/schema.sql` é o
      # retrato de até a migração 008, e o resto vem por cima. Rodar só o schema
      # deixaria o banco anos atrasado; rodar só as migrações não teria o que
      # migrar.
      - name: Levantar o banco (retrato + migrações)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d fotonio_teste \
            -v ON_ERROR_STOP=1 -q -f db/schema.sql
          node scripts/migrar.mjs --aplicar

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # O servidor de desenvolvimento é DEPENDÊNCIA de 32 das suítes — elas
      # abrem páginas e batem em rotas. Sem ele o corredor as pula, e pular
      # metade em silêncio é o que o `--exigir-tudo` lá embaixo existe para
      # impedir.
      - name: Subir o servidor de desenvolvimento
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3040/api/healthz > /dev/null; then
              echo "servidor no ar e saudável"
              exit 0
            fi
            sleep 2
          done
          echo "✗ o servidor não ficou saudável a tempo"
          echo "--- healthz:"; curl -s http://localhost:3040/api/healthz || true
          echo; echo "--- log:"; tail -60 /tmp/dev.log
          exit 1

      # `--exigir-tudo` transforma "pulado" em REPROVAÇÃO.
      #
      # É a diferença entre um CI que cobre e um que enfeita: se o armazém não
      # subir, ou o servidor cair, as suítes seriam puladas em silêncio e a
      # execução ficaria verde cobrindo um terço. Aqui isso é vermelho, e
      # vermelho é o que faz alguém olhar.
      - name: Suíte inteira
        run: npm test -- --exigir-tudo

      - name: Build de produção
        run: npm run build

      # O log do servidor só interessa quando algo deu errado — e aí interessa
      # muito, porque a falha da suíte costuma ser o sintoma e não a causa.
      - name: Log do servidor (só quando falha)
        if: failure()
        run: tail -100 /tmp/dev.log || true
